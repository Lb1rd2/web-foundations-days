<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture your ideas in seconds.</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <h2>My Notes</h2>
    <p>Write a note below and keep all your ideas, reminders, and to-dos in one place.</p>

    <section>
      <h3>New note</h3>
      <p>
        <label for="note-title">Title</label>
        <input type="text" id="note-title" name="note-title">
      </p>
      <p>
        <label for="note-body">Note</label>
        <textarea id="note-body" name="note-body" rows="4"></textarea>
      </p>
      <button type="button">Add note</button>
    </section>

    <section>
      <h3>Saved notes</h3>
      <ul>
        <li>Buy groceries</li>
        <li>Finish Day 1 assignment</li>
        <li>Call Mum on Sunday</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes</p>
  </footer>
</body>
</html>
